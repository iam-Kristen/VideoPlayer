name: Rex Image Workflow

on:
  push:
    paths:
      - 'Rex/icon/**'
  pull_request:
    paths:
      - 'Rex/icon/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate_json:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate JSON
        run: python .github/scripts/generate_image_json.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: json-artifact
          path: ${{ github.workspace }}/Rex/Logo.json
      - name: Push updated Logo.json
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add Rex/Logo.json
          git diff --cached --quiet || git commit -m "自動更新 Rex 圖標集"
          git push origin HEAD:main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
